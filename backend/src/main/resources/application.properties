spring.application.name=backend
server.port=${SERVER_PORT:9090}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smartparking}
spring.datasource.username=${DB_USERNAME:smartparking}
spring.datasource.password=${DB_PASSWORD:smartparking}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health

app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-0123456789}