name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smartparking
          POSTGRES_USER: smartparking
          POSTGRES_PASSWORD: smartparking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartparking -d smartparking"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Tests et build Maven
        working-directory: backend
        run: mvn -B -ntp verify

      - name: Construire l'image Docker
        run: docker build -t smartparking-backend:ci ./backend

  publish:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construire et publier l'image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/smartparking-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/smartparking-backend:${{ github.sha }}